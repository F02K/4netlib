name: 4netlib
version: '${version}'
main: net.f02k.safetyspy.SafetySpyPlugin
api-version: '1.21'
description: Safety spy mode for server staff - hides players completely via PacketEvents.
depend: [packetevents]

commands:
  spy:
    description: Toggle safety spy mode.
    usage: /spy [player|list|reload]
    aliases: [4netlib, sspy]

# Only 4netlib.use is given to OPs by default. Everything that could reveal a
# spy (seeing, listing, toggling others) must be granted explicitly.
permissions:
  4netlib.use:
    description: Toggle spy mode for yourself.
    default: op
  4netlib.reload:
    description: Reload the configuration.
    default: op
  4netlib.others:
    description: Toggle spy mode for other players.
    default: false
  4netlib.list:
    description: List all players in spy mode.
    default: false
  4netlib.see:
    description: See players that are in spy mode (only if enabled in config.yml).
    default: false
  4netlib.autojoin:
    description: Automatically join the server in spy mode.
    default: false
