name: 4netlib
version: '${version}'
main: net.f02k.safetyspy.SafetySpyPlugin
api-version: '1.21'
description: Safety spy mode for server staff - hides players completely via PacketEvents.
depend: [packetevents]

# /spy only exists for players listed in config.yml -> access.players.
commands:
  spy:
    description: Toggle safety spy mode.
    usage: /spy [player|list|reload]
    aliases: [4netlib, sspy]
    permission: 4netlib.command

permissions:
  4netlib.command:
    description: Internal - granted automatically to players in access.players.
    default: false
  4netlib.see:
    description: See players that are in spy mode (only if enabled in config.yml).
    default: false
  4netlib.autojoin:
    description: Join the server in spy mode (only for players in access.players).
    default: false
